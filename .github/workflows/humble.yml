name: Humble

on:
  workflow_dispatch:
    branches:
      - humble
  pull_request:
    branches:
      - humble
  push:
    branches:
      - humble

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      # - name: Install dependencies
      #   run: sudo apt update && sudo apt install -y libboost-dev
    
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: build and test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: robotiq_controllers robotiq_description robotiq_controllers robotiq_driver robotiq_hardware_tests
          target-ros2-distro: humble
          vcs-repo-file-url: ros2_robotiq_gripper.humble.repos


      
